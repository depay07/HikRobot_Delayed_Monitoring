; 항상 위에 표시: 1=다른 일반 창보다 위에 표시, 0=일반 창으로 표시합니다.
; 프로그램을 다시 실행하면 적용됩니다. CAMERA 구역보다 위에 입력하세요.
ALWAYS_ON_TOP=1

; FTP로 PC에 저장되는 이미지를 검사 횟수만큼 늦춰 표시합니다.
; 등호 오른쪽 값을 수정하고 프로그램을 다시 실행하세요. UTF-8로 저장하세요.

; 카메라 수: 1~4. 1대는 전체, 2대는 좌우, 3~4대는 2행 2열입니다.
CAMERAS=1
; PC 모니터 번호: 첫 번째 0, 두 번째 1입니다.
MONITOR=0
; 로고 오른쪽에 표시할 이름입니다. 예: 링 유무검사
INSPECTION_TEXT=
; 몇 개 전 이미지를 표시할지 입력합니다. 13이면 첫 이미지 이후 새 이미지 13개가 들어온 때(14번째 입력) 첫 이미지를 표시합니다.
; 0이면 새 이미지를 바로 표시합니다. 처음 13개까지는 수신을 기다립니다.
DELAY_COUNT=13

; PC의 FTP 이미지 수신 최상위 폴더입니다. 실제 저장 폴더로 바꾸세요.
; 예: D:\vision을 입력하면 D:\vision\2026\09\26 등의 날짜 폴더도 자동으로 읽습니다.
; 날짜가 바뀌어도 이 경로를 바꿀 필요가 없습니다.
IMAGE_FOLDER=D:\vision

[CAMERA1]
; 카메라 IP 주소를 입력하세요. 비워 두면 FTP 이미지만 표시합니다.
IP=
; VisionMaster Remote 접속 포트입니다. 기본값은 5556입니다. 검사 명령용 TCP 포트와 다릅니다.
PORT=5556
; 카메라 원격 접속 비밀번호입니다.
PASSWORD=
; 시작할 때 자동 로딩할 카메라 내부 Solution 파일의 전체 경로입니다. 예: /root/vmtempfiles/ftp/solution/검사.solx
SOLUTION_PATH=
; Solution 파일에 암호가 있을 때 입력합니다. 없으면 비워 두세요.
SOLUTION_PASSWORD=

; 화면에 표시할 카메라 이름입니다.
TITLE=CAMERA 1

; 파일 저장 시간(수정한 시간)순으로 읽고, 저장된 그래픽과 OK/NG를 포함한 이미지를 그대로 표시합니다.
; 프로그램 실행 전에 있던 과거 이미지는 제외하고 새로 저장되는 이미지부터 셉니다.
; 카메라가 여러 대이면 CAMERA2~CAMERA4 구역을 추가하고 각 구역에 IMAGE_FOLDER를 따로 지정하세요.
