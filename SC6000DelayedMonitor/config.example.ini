; SC6000 검사 횟수 지연 모니터 설정
; 등호 왼쪽의 영문 항목명은 프로그램이 읽는 이름이므로 바꾸지 마세요.
; 등호 오른쪽에 현장에 맞는 값을 입력하고 저장한 뒤 프로그램을 다시 실행하세요.
; 아래 Flow1, InspectionImage, InspectionResult는 설명용 예시이며 실제 이름이 아닙니다.
; 현재 흐름과 출력 이름은 미정이므로 PROCEDURE, IMAGE_OUTPUT, RESULT_OUTPUT은 비워 두었습니다.
; 이 세 항목이 비어 있으면 실시간 화면은 연결하지만 지연 화면에는 출력 설정 필요 안내가 나옵니다.
; 설정 파일은 한글이 유지되도록 UTF-8로 저장하세요.

; 표시할 카메라 대수입니다. 1~4까지 입력할 수 있습니다.
; 1대: 전체 화면 / 2대: 좌우 분할 / 3~4대: 2행 2열 배치
CAMERAS=1

; 프로그램을 표시할 PC 모니터 번호입니다. 첫 번째 모니터는 0, 두 번째는 1입니다.
MONITOR=0

; 화면 위쪽 로고 오른편에 표시할 검사 이름입니다. 예: 링 유무검사
; 표시할 이름이 없으면 등호 오른쪽을 비워 두세요.
INSPECTION_TEXT=

; 몇 회 전 검사 결과를 보여줄지 지정합니다. 시간(초)이 아니라 검사 횟수입니다.
; 14 입력: 검사 15번이 끝날 때 검사 1번의 이미지와 판정을 표시합니다.
; 처음 14회 동안은 결과를 모으며 대기합니다. 0 입력: 현재 검사 결과를 표시합니다.
; 음수나 숫자가 아닌 값은 0으로 처리합니다.
DELAY_COUNT=14

[CAMERA1]
; 이 카메라의 실제 IP 주소를 입력하세요.
; 192.0.2.10은 설명용 주소이므로 실제 카메라 주소로 바꿔야 합니다.
IP=192.0.2.10

; 이 카메라의 VisionMaster 원격 접속 비밀번호를 입력하세요.
PASSWORD=

; PC 화면에 표시할 카메라 이름입니다. 예: 1번 카메라
TITLE=CAMERA 1

; 카메라 안의 VisionMaster Solution에서 제품 검사를 수행하는 흐름의 이름입니다.
; VisionMaster에서 해당 Solution을 열고, 제품 1개를 검사하는 흐름 이름을 확인하여 그대로 입력하세요.
; 예: 흐름 이름이 Flow1이면 PROCEDURE=Flow1
; 제품 1개당 이 흐름이 정확히 한 번 완료되어야 지연 횟수가 맞습니다.
; Solution 파일명(.sol/.solx), 카메라 폴더 경로, 개별 검사 도구 이름을 적는 항목이 아닙니다.
PROCEDURE=

; 위 흐름의 출력 항목 중, 지연 화면에 보여줄 검사 이미지를 내보내는 항목의 이름입니다.
; VisionMaster에서 위 흐름의 출력 설정을 확인하고, 이미지형 출력 항목의 이름을 그대로 입력하세요.
; 예: 이미지형 출력 이름을 InspectionImage로 만들었다면 IMAGE_OUTPUT=InspectionImage
; 이미지 파일명(.jpg 등), 저장 폴더, 이미지 소스 도구 이름을 적는 항목이 아닙니다.
; 이미지형 출력이 없다면 Solution에서 검사 이미지를 흐름의 이미지형 출력으로 연결해 두어야 합니다.
IMAGE_OUTPUT=

; 위 흐름의 출력 항목 중, 최종 양품(OK)/불량(NG) 판정을 숫자로 내보내는 항목의 이름입니다.
; VisionMaster에서 위 흐름의 출력 설정을 확인하고, 정수형 출력 항목의 이름을 그대로 입력하세요.
; 예: 정수형 출력 이름을 InspectionResult로 만들었다면 RESULT_OUTPUT=InspectionResult
; 여기에 OK, NG, 1, 0을 직접 적는 것이 아니라, 그 값을 내보내는 출력 항목의 이름을 적습니다.
; 검사 1회마다 정수 1개가 나와야 하며, 위 이미지와 같은 제품의 최종 판정이어야 합니다.
; 정수형 판정 출력이 없다면 Solution에서 먼저 해당 출력을 구성해야 합니다.
RESULT_OUTPUT=

; 위 RESULT_OUTPUT에서 양품(OK)일 때 나오는 숫자입니다.
; 예: 양품이면 1을 출력하도록 Solution을 만들었다면 OK_VALUE=1
OK_VALUE=1

; 위 RESULT_OUTPUT에서 불량(NG)일 때 나오는 숫자입니다.
; 예: 불량이면 0을 출력하도록 Solution을 만들었다면 NG_VALUE=0
; OK_VALUE와 NG_VALUE는 서로 달라야 합니다. 실제 Solution의 판정 숫자를 확인하세요.
NG_VALUE=0

; 카메라가 2~4대이면 [CAMERA2], [CAMERA3], [CAMERA4] 항목을 같은 형식으로 추가하세요.
; 각 카메라의 IP, 비밀번호, 흐름 이름, 출력 이름은 해당 카메라의 실제 설정에 맞게 입력하세요.
